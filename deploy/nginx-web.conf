# Nginx reverse proxy for the ExitRadar web app (Next.js) running under pm2 on :3000.
# Put this at /etc/nginx/sites-available/exitradar-web (symlink into sites-enabled) OR
# /etc/nginx/conf.d/exitradar-web.conf, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.exitradar.fun     # adds the 443 block + auto-renew
#
# This serves a NEW subdomain (app.exitradar.fun) and does NOT touch the existing
# static landing on exitradar.fun (profitflow-landing, :8080).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name app.exitradar.fun;            # <- your subdomain (point its DNS A record at this VPS)

  location / {
    proxy_pass http://127.0.0.1:3000;        # next start -p 3000 (pm2: profitflow-web)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
