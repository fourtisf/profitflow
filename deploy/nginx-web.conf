# Nginx for the ExitRadar web app (Next.js :3000) + realtime feed WebSocket (apps/api :4000).
# Serves app.exitradar.fun over HTTPS and proxies /ws to the API so the live feed works.
#
# Install (replaces the earlier port-80 template; cert already issued by certbot):
#   sudo cp /opt/profitflow-src/deploy/nginx-web.conf /etc/nginx/conf.d/exitradar-web.conf
#   sudo nginx -t && sudo systemctl reload nginx
# (If you haven't run certbot yet: use the port-80 block only first, then `certbot --nginx -d app.exitradar.fun`.)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name app.exitradar.fun;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name app.exitradar.fun;

  ssl_certificate     /etc/letsencrypt/live/app.exitradar.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.exitradar.fun/privkey.pem;

  # Realtime feed WebSocket -> apps/api (:4000). MUST be declared before `location /`.
  location /ws {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;            # keep long-lived sockets open
  }

  # Everything else -> the Next.js app (:3000)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
