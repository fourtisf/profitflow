# Sample Nginx reverse proxy for the ProfitFlow API (REST + WebSocket) with TLS.
# Put certs via certbot/Cloudflare, point api.<domain> here. The web frontend stays on Vercel.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name api.profitflow.io;            # TODO: real domain (TBD)
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.profitflow.io;            # TODO: real domain (TBD)

  ssl_certificate     /etc/letsencrypt/live/api.profitflow.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.profitflow.io/privkey.pem;

  # REST + WebSocket (the /ws upgrade is handled by the same proxy block).
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;               # keep long-lived WS connections open
  }
}
