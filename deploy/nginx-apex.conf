# exitradar.fun (apex) -> ExitRadar Next.js app (:3000) + realtime /ws (:4000).
# Makes the app the ONE site. Retires the static landing (profitflow-landing :8080).
#
# Install (replaces the current apex config; cert for exitradar.fun already issued):
#   sudo cp /opt/profitflow-src/deploy/nginx-apex.conf /etc/nginx/conf.d/exitradar.conf
#   # remove/!disable the old apex file if it's a different filename (see plan step 1)
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name exitradar.fun www.exitradar.fun;
  return 301 https://exitradar.fun$request_uri;
}

server {
  listen 443 ssl http2;
  server_name exitradar.fun;

  ssl_certificate     /etc/letsencrypt/live/exitradar.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/exitradar.fun/privkey.pem;

  # Realtime feed WebSocket -> apps/api (:4000). MUST come before `location /`.
  location /ws {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Everything else -> the Next.js app (:3000)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
