# exitradar.fun (apex + www) -> ExitRadar Next.js app (:3000) + realtime /ws (:4000).
# Makes the app the ONE site; retires the static landing (profitflow-landing :8080).
# Matches the existing Certbot setup (cert covers exitradar.fun + www).
#
# Replace the current apex file (/etc/nginx/sites-available/profitflow) with this — see the plan.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# http -> https (apex + www)
server {
  listen 80;
  server_name exitradar.fun www.exitradar.fun;
  return 301 https://exitradar.fun$request_uri;
}

# www -> apex (canonical)
server {
  listen 443 ssl http2;
  server_name www.exitradar.fun;
  ssl_certificate     /etc/letsencrypt/live/exitradar.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/exitradar.fun/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://exitradar.fun$request_uri;
}

# apex -> the app
server {
  listen 443 ssl http2;
  server_name exitradar.fun;

  ssl_certificate     /etc/letsencrypt/live/exitradar.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/exitradar.fun/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Realtime feed WebSocket -> apps/api (:4000). MUST come before `location /`.
  location /ws {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Everything else -> the Next.js app (:3000)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
